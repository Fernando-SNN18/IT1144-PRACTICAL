<!DOCTYPE html>
<html lang="en">
<head>
<title> Student Registration Form </title>
<style>
body{
	font-family:sans-serif;
	background-color:#fof4f8;
	padding:40px;
	margin:0;
}
h1{
	color:#19202C
	font-size:1.6rem;
	margin-bottom:24px;
}
</style>
</head>
<body>
   <h1>Student Registration Form</h1>
   <form>
      <label>Full Name</label>
   <input type="text"placeholder="Enter your full name">
   </input>
   <br><br>

   <label>Email Address</label>
   <input type="email" placeholder="vau@gmail.com">
   </input>
   <br><br>

   <label>Password</label>
   <input type="Password"placeholder="Enter 8 characters."</input>
   <br> <br>

   <label>Age</label>
   <input type="number"placeholder="Your age"></input>
   <br><br>

   <label>Phone Number </label>
   <input type="tel"placeholder="+94000000000"></input>
   <br><br>

   <p>Gender</p>
   <label>
   	<input type="radio" name="Gender">
   </input>
   Female
   </label>
   <br>

   <label>
   	<input type="radio" name="Gender"></input>
   	Male
   </label>
   <br>

   <label>
   	<input type="radio"name="Gender"</input>
   Prefer not to say.</label>
   <br><br>

   <p>Skills</p>
   <label>
   	<input type="checkbox"name="Skills"></input>
   	HTML
   </label>
   <br>

   <label>
   	<input type = "checkbox"name="Skills"></input>
   	CSS
   </label>
   <br>

    <label>
   	<input type = "checkbox"name="Skills"></input>
   	PHP
   </label>
   <br>

    <label>
   	<input type = "checkbox"name="Skills"></input>
   	C++
   </label>
   <br><br>

   <label> Year Of Study </label>
   <select name="Year">
   	   <option> --Select Year-- </option>
   	   <option> 1st Year </option>
   	   <option> 2nd Year </option>
   	   <option> 3rd Year </option>
   	   <option> 4th Year </option>
   	</select>
   	<br><br>
    
    <label> About You </label>
    <textarea rows = "4" placeholder="Tell us a bit about yourself..."> </textarea>

    <br><br><br><br>

    <button type="submit">Submit</button>

    </body>
   </html>
